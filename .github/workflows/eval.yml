name: RAG evaluation

# Builds the real index from EDGAR and runs the evaluation harness.
#  - Retrieval ablation always runs (no API key needed) and gates on recall@6.
#  - Generation eval (faithfulness, refusals, citations) runs when the GEMINI_API_KEY
#    repository secret is set: Settings -> Secrets and variables -> Actions.
on:
  push:
    branches: [main]
    paths: ["src/**", "eval/questions.jsonl", ".github/workflows/eval.yml"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly: picks up newly filed 10-Ks

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEC_USER_AGENT: "sec-filings-rag research vishalmankala77@gmail.com"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            .hf-cache
          key: edgar-hf-${{ hashFiles('src/secrag/config.py') }}-${{ github.run_id }}
          restore-keys: edgar-hf-${{ hashFiles('src/secrag/config.py') }}-
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[models]"
      - name: Download 10-Ks and build the index
        run: secrag ingest | tee ingest.txt
      - name: Retrieval ablation (gate)
        run: secrag eval --retrieval-only --min-recall 0.6
      - name: Generation eval (needs GEMINI_API_KEY secret)
        if: env.GEMINI_API_KEY != ''
        run: secrag eval --min-recall 0.6 --min-faithfulness 0.8
      - name: Job summary
        if: always()
        run: |
          { echo '## Ingest'; echo '```'; cat ingest.txt || true; echo '```'; cat eval/results/results.md || true; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/results/
