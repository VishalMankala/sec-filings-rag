[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secrag"
version = "1.0.0"
description = "Question answering over SEC 10-K filings: hybrid retrieval (BM25 + embeddings + reranker), cited answers, evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vishal Mankala" }]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0", "google-genai>=1.0"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
secrag = "secrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
